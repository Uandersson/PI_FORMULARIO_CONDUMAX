<div class="page">
  <div class="admin-panel">
    <header>
      <h2>Gerenciamento de Usuários</h2>
      <button (click)="logout()">Logout</button>
    </header>

    <form [formGroup]="form" (ngSubmit)="salvarUsuario()">
      <div class="form-grid">
        <input
          type="text"
          formControlName="user"
          placeholder="Usuário"
          required
        />
        <input
          type="password"
          formControlName="senha"
          placeholder="Senha"
          required
        />
        <select formControlName="role">
          <option value="user">Usuário</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit">
        {{ editando ? 'Atualizar Usuário' : 'Criar Usuário' }}
      </button>

      <button *ngIf="editando" type="button" class="cancelar" (click)="cancelarEdicao()">
        Cancelar
      </button>
    </form>

    <hr />

    <div class="lista">
      <h3>Usuários Cadastrados</h3>
      <table>
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Função</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td>{{ u.user }}</td>
            <td>{{ u.role }}</td>
            <td>
              <button (click)="editar(u)">Editar</button>
              <button (click)="excluir(u.id)">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="usuarios.length === 0">Nenhum usuário cadastrado.</p>
    </div>
  </div>
</div>
